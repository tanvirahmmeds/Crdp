name: Windows Browser Desktop (Zero Install)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Generate Password
        shell: pwsh
        run: |
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
          $pass = -join ((1..8) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          "DESKTOP_PASSWORD=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Generated password: $pass"

      - name: Download TightVNC
        shell: pwsh
        run: |
          $url = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $url -OutFile "tightvnc.msi"

      - name: Install TightVNC
        shell: pwsh
        run: |
          $pass = $env:DESKTOP_PASSWORD
          msiexec /i tightvnc.msi /quiet /norestart `
            ADDLOCAL=Server `
            SERVER_REGISTER_AS_SERVICE=1 `
            SERVER_ADD_FIREWALL_EXCEPTION=1 `
            SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 `
            SET_PASSWORD=1 VALUE_OF_PASSWORD=$pass
          Start-Sleep -Seconds 15

      - name: Start TightVNC Service
        shell: pwsh
        run: |
          $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Error "TightVNC not installed!"; exit 1 }
          if ($svc.Status -ne 'Running') {
            Start-Service tvnserver
            Start-Sleep -Seconds 5
          }
          $svc = Get-Service tvnserver
          if ($svc.Status -ne 'Running') { Write-Error "TightVNC failed to start!"; exit 1 }
          Write-Host "TightVNC running on port 5900"

      - name: Download & Patch noVNC
        shell: pwsh
        run: |
          $url = "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "novnc.zip"
          Expand-Archive novnc.zip -DestinationPath .
          Rename-Item "noVNC-1.5.0" "novnc"
          
          # Patch 1: Disable loopback check in ui.js
          $uiJs = Get-Content "novnc/app/ui.js" -Raw
          $uiJs = $uiJs -replace "Host\.isLoopback\(\)\s*&&\s*!UI\.getSetting\('allow_loopback'\)", "false"
          $uiJs = $uiJs -replace "Host\.isLoopback\(\)\s*&&\s*!UI\.getSetting\(`"allow_loopback`"\)", "false"
          $uiJs | Out-File "novnc/app/ui.js" -Encoding utf8
          
          # Patch 2: Set default allow_loopback to true
          $settingsFiles = @("novnc/app/settings.js", "novnc/app/localsettings.js")
          foreach ($file in $settingsFiles) {
            if (Test-Path $file) {
              $content = Get-Content $file -Raw
              $content = $content -replace "allow_loopback:\s*false", "allow_loopback: true"
              $content = $content -replace "'allow_loopback',\s*false", "'allow_loopback', true"
              $content | Out-File $file -Encoding utf8
            }
          }
          
          # Patch 3: Inject localStorage set into vnc.html
          $vncHtml = Get-Content "novnc/vnc.html" -Raw
          $inject = @"
          <script>
            if (typeof localStorage !== 'undefined') {
              localStorage.setItem('noVNC_allow_loopback', 'true');
            }
          </script>
          "@
          $vncHtml = $vncHtml -replace '</head>', "$inject</head>"
          $vncHtml | Out-File "novnc/vnc.html" -Encoding utf8
          
          Write-Host "noVNC patched successfully"

      - name: Install websockify
        shell: pwsh
        run: pip install websockify

      - name: Download cloudflared
        shell: pwsh
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe"

      - name: Start Tunnel & Print Details
        shell: pwsh
        run: |
          $novncPath = "$PWD\novnc"
          
          # Start websockify
          Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "--web", $novncPath, "8080", "localhost:5900" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          # Verify websockify
          $retry = 0
          do {
            $listener = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
            if ($listener) { break }
            Start-Sleep -Seconds 2
            $retry++
          } while ($retry -lt 5)
          
          if (-not $listener) {
            Write-Error "websockify failed to start on port 8080!"
            exit 1
          }
          Write-Host "websockify listening on port 8080"
          
          # Start cloudflared tunnel
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "cloudflared.exe tunnel --url http://localhost:8080 --no-autoupdate > cf.log 2>&1" -WindowStyle Hidden
          Write-Host "Waiting for Cloudflare tunnel..."
          Start-Sleep -Seconds 30
          
          # Extract tunnel URL
          $url = $null
          for ($i = 0; $i -lt 20; $i++) {
            $log = Get-Content "cf.log" -Raw -ErrorAction SilentlyContinue
            if ($log -match "(https://[a-zA-Z0-9-]+\.trycloudflare\.com)") {
              $url = $matches[1]
              break
            }
            Start-Sleep -Seconds 3
          }
          
          if (-not $url) {
            Write-Host "=== CLOUDFLARED LOGS ==="
            Get-Content "cf.log" -ErrorAction SilentlyContinue
            Write-Error "Failed to get tunnel URL!"
            exit 1
          }
          
          # URL with auto-connect params
          $connectUrl = "$url/vnc.html?autoconnect=true&reconnect=true&reconnect_delay=10&path=websockify"
          
          Write-Host ""
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║       WINDOWS DESKTOP IS LIVE!       ║"
          Write-Host "╠════════════════════════════════════════╣"
          Write-Host "║  URL:      $connectUrl"
          Write-Host "║  Password: $env:DESKTOP_PASSWORD"
          Write-Host "╚════════════════════════════════════════╝"
          Write-Host ""
          
          # Keep alive
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active: $i min / 360 max"
          }

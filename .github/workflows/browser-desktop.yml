name: Windows Browser Desktop (Zero Install)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download TightVNC
        shell: pwsh
        run: |
          $url = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $url -OutFile "tightvnc.msi"

      - name: Install TightVNC with Password
        shell: pwsh
        run: |
          $pass = "${{ secrets.VNC_PASSWORD }}"
          if ($pass.Length -gt 8) { $pass = $pass.Substring(0,8) }
          Write-Host "Installing TightVNC (password length: $($pass.Length))"
          msiexec /i tightvnc.msi /quiet /norestart `
            ADDLOCAL=Server `
            SERVER_REGISTER_AS_SERVICE=1 `
            SERVER_ADD_FIREWALL_EXCEPTION=1 `
            SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 `
            SET_PASSWORD=1 VALUE_OF_PASSWORD=$pass

      - name: Start TightVNC Service
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          Start-Service tvnserver -ErrorAction SilentlyContinue
          net start tvnserver 2>$null
          Write-Host "TightVNC service status:"
          Get-Service tvnserver | Select-Object Name, Status

      - name: Download noVNC
        shell: pwsh
        run: |
          $url = "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "novnc.zip"
          Expand-Archive novnc.zip -DestinationPath .
          Rename-Item "noVNC-1.5.0" "novnc"

      - name: Install websockify
        shell: pwsh
        run: |
          pip install websockify

      - name: Download cloudflared
        shell: pwsh
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe"

      - name: Start Desktop Tunnel
        shell: pwsh
        run: |
          $novncPath = "$PWD\novnc"
          
          # Start websockify: serves noVNC web files on :8080, proxies websockets to TightVNC :5900
          Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "--web", $novncPath, "8080", "localhost:5900" -WindowStyle Hidden
          Write-Host "websockify started on port 8080"
          Start-Sleep -Seconds 3
          
          # Start Cloudflare ephemeral tunnel (no account/domain needed)
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:8080", "--no-autoupdate" -RedirectStandardOutput "cf.log" -WindowStyle Hidden
          Write-Host "Cloudflare tunnel starting..."
          Start-Sleep -Seconds 15
          
          # Extract the public URL from logs
          $log = Get-Content "cf.log" -Raw -ErrorAction SilentlyContinue
          if ($log -match "https://[a-z0-9-]+\.trycloudflare\.com") {
            $url = $matches[0]
          } else {
            # Fallback: read line by line
            $url = (Get-Content "cf.log" | Select-String -Pattern "https://.*trycloudflare.com" | Select-Object -First 1).Line.Trim()
          }
          
          Write-Host ""
          Write-Host "╔════════════════════════════════════════════════════════════╗"
          Write-Host "║                 DESKTOP IS LIVE!                           ║"
          Write-Host "╠════════════════════════════════════════════════════════════╣"
          Write-Host "║  URL:      $url/vnc.html"
          Write-Host "║  Password: ${{ secrets.VNC_PASSWORD }}  (max 8 chars used)"
          Write-Host "║  User:     (none — VNC uses password only)"
          Write-Host "╚════════════════════════════════════════════════════════════╝"
          Write-Host ""
          Write-Host "Steps to connect:"
          Write-Host "  1. Open the URL above in any browser"
          Write-Host "  2. Click 'Connect'"
          Write-Host "  3. Enter the password when prompted"
          Write-Host "  4. You now have full Windows desktop control"
          Write-Host ""
          
          # Keep the job alive for 6 hours max
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session active... ($i min / 360 max)"
          }
          
